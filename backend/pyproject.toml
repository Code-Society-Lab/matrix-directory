[build-system]
requires = ["setuptools>=84", "wheel>=0.48"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-directory-backend"
version = "0.1.0"
authors = [
    { name = "Chris Dedman" },
    { name = "Simon Roy" }
]
maintainers = [
    { name = "Code Society Lab", email = "admin@codesociety.xyz" }
]
description = "Backend for the Matrix Directory"
readme = { text = "Backend for the Matrix Directory.", content-type = "text/markdown" }
license = "MIT"
requires-python = ">=3.10"

dependencies = [
  "fastapi[standard]>=0.141.1",
  "sqlmodel>=0.0.38",
  "sqlmodel-toolkit @ git+https://github.com/Code-Society-Lab/sqlmodel-toolkit.git",
  "pelican-migration>=0.1.3a0",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.15.0",
  "httpx>=0.28.1",
  "authlib>=1.7.2",
  "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "black==26.5.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "mypy==2.3.0",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=app",
  "--cov-report=term-missing",
  "--cov-fail-under=65",
]
filterwarnings = [
  "error",
  "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.black]
target-version = ["py310"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
]
precision = 1
show_missing = true
skip_covered = true
