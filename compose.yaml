services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: matrix_directory
      POSTGRES_USER: matrix
      POSTGRES_PASSWORD: matrix
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrix -d matrix_directory"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://matrix:matrix@db:5432/matrix_directory
      FRONTEND_ORIGIN: http://localhost:5173
    command: >
      sh -c "pelican up &&
             python -m app.seed &&
             fastapi run app/main.py --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  frontend_node_modules:
